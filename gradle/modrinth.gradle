apply plugin: 'com.dynamero.props'

def dep = props.load('dependencies')
def local = props.load('local')

def token = local.MODRINTH_TOKEN
def project_id = local.MODRINTH_ID
def mod_version = dep.materia_version
def game_version = dep.minecraft_version
def release_mode = dep.materia_release_type
def mod_name = dep.materia_archives_base_name

def changelogFile = rootProject.file("CHANGELOG.md")
def changelogText = changelogFile.exists() ? changelogFile.text : "No changelog provided."

def loaderName = project.name.contains('fabric') ? 'fabric' : 'neoforge'

def displayLoader = loaderName == 'fabric' ? 'Fabric' : 'NeoForge'

modrinth {
    token = "${token}"
    projectId = "${project_id}"
    versionNumber = "${mod_version}+${loaderName}"
    versionName = "${mod_name} [${displayLoader}] ${mod_version}"
    versionType = "${release_mode}"
    uploadFile = tasks.named('jar') // With Loom, this MUST be set to `remapJar` instead of `jar`!
    gameVersions = ["${game_version}"] // Must be an array, even with only one version
    loaders = [loaderName] // Must also be an array - no need to specify this if you're using Loom or ForgeGradle
    dependencies { // A special DSL for creating dependencies
        // scope.type
        // The scope can be `required`, `optional`, `incompatible`, or `embedded`
        // The type can either be `project` or `version`
        if (loaderName == 'fabric') {
            required.project "fabric-api" // Creates a new required dependency on Fabric API
        }
        //optional.version "sodium", "mc1.19.3-0.4.8" // Creates a new optional dependency on this specific version of Sodium
    }

    changelog = changelogText
}