apply plugin: 'com.dynamero.props'

def dep = props.load('dependencies')
def local = props.load('local')

def token = local.CURSEFORGE_TOKEN
def project_id = local.CURSEFORGE_ID
def mod_version = dep.gradus_version
def mod_name = dep.gradus_archives_base_name
def release_mode = dep.gradus_release_type

def changelogFile = rootProject.file("CHANGELOG.md")
def changelogContent = changelogFile.exists() ? changelogFile.text : "No changelog provided."

def uploadTask = tasks.named('jar') //tasks.findByName('remapJar')

def loaderName = project.name.contains('fabric') ? 'fabric' : 'neoforge'

def displayLoader = loaderName == 'fabric' ? 'Fabric' : 'NeoForge'

curseforge {
    apiToken = "${token}"

    publications {
        def pub = findByName("curseForge") ?: register("curseForge").get()
        pub.projectId = "${project_id}"

        // 1. Set Minecraft Game Version
        pub.gameVersions.add("${dep.minecraft_version}")

        // 2. Set Mod Loader (CurseForge requires loader as a game version)
        pub.gameVersions.add("${loaderName}")

        def mainArtifact = pub.artifacts.findByName("main") ?: pub.artifacts.register("main").get()

        mainArtifact.from(uploadTask)
        mainArtifact.displayName = "${mod_name} [${displayLoader}] - ${mod_version}"
        mainArtifact.releaseType = "${release_mode}"

        mainArtifact.changelog {
            format = 'markdown'
            content = changelogContent
        }

        mainArtifact.relations {
            if (loaderName == 'fabric') {
                requiredDependency("fabric-api")
            }
        }
    }
}

tasks.register('curseforge') {
    group = 'publishing'
    description = "Publishes ${project.name} artifacts to CurseForge."
    dependsOn(tasks.named('publishToCurseForge'))
}