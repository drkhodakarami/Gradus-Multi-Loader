pluginManagement {
    def loomProps = new Properties()

    def depsFile = file("dependencies.properties")

    if (!depsFile.exists()) {
        depsFile = file("${rootDir.parent}/dependencies.properties")
    }

    if (!depsFile.exists()) {
        depsFile = file("${rootDir.parent}/shared-config/dependencies.properties")
    }

    depsFile.withReader { reader ->
        loomProps.load(reader)
    }

    repositories {
        mavenLocal()
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
        maven { url = 'https://repo.repsy.io/mvn/thementor/props' }
    }

    plugins {
        id 'net.fabricmc.fabric-loom' version loomProps.getProperty('loom_version')
        id 'com.diffplug.spotless' version loomProps.getProperty('spotless_version')
        id 'com.modrinth.minotaur' version loomProps.getProperty('minotaur_version')
        id 'io.github.themrmilchmann.curseforge-publish' version loomProps.getProperty('cursegralde_version')
        id 'net.neoforged.moddev' version loomProps.getProperty('neoforge_plugin_version')
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'Materias'
include('common')
include('fabric')
include('neoforge')